[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brief-touch-mechanics"
version = "0.1.0"
description = "Brief-contact friction estimation and independent forward-motion evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
brief-touch = "brief_touch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
